<!DOCTYPE html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#b0ff50">
<link rel="stylesheet" href="/x/include/common.css">
<link rel="stylesheet" href="/x/include/component.css">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&family=Chiron+GoRound+TC:wght@400..700&display=swap');
</style>
<script type="module">
    import { A, E, O, Q } from 'https://aeoq.github.io/AEOQ.mjs'; Object.assign(window, { A, E, O, Q });
</script>
<script src="/x/include/common.js"></script>
<script src="https://unpkg.com/onnxruntime-web@latest/dist/ort.min.js"></script>
<script src="https://unpkg.com/@bunnio/rembg-web@latest/dist/index.umd.js"></script>
<script type="module" src="https://aeoq.github.io/drag-knob.mjs"></script>

<form>
    <fieldset style="grid-area: 1/1/2/3;">
        <canvas></canvas>
        <label><input id="CX" type="file" accept="image/*"></label>
    </fieldset>
    <fieldset>
        <input type="color">
        <output name="side"></output>
        <drag-knob range=".5/4/.005" value="3.54" name="sc" class="fine"></drag-knob>
        <drag-knob range="-20/20/1" value="0" name="x"></drag-knob>
        <drag-knob range="-20/20/1" value="0" name="y"></drag-knob>
        <drag-knob range="-.1/.1/.001" value="0" name="ro" class="fine"></drag-knob>
    </fieldset>
    <fieldset style="grid-area: 3/3; align-self: center;">
        <label><input type="checkbox" checked name="Rembg">BG</label>
        <label><input type="checkbox" checked name="Magick">Trim</label>
        <drag-knob range="200/500/1" value="500" name="size"></drag-knob>
        <label><input type="checkbox" checked name="Quant">Compress</label>
    </fieldset>
    <label><input type="file" multiple="" accept="image/*"></label>
    <img><img><img>
    <button style="grid-area: 2/3;">GO</button>
</form>
<style>
form {
    display: grid; gap: .5em; grid-template-columns: 1fr 1fr 5em;
    max-width: 30em;
    margin: auto;
    
    fieldset:first-child {
        position: relative;
        
        canvas {
            width: 100%; aspect-ratio: 1;
            border:.1em solid var(--theme);
        }
        label:has(#CX) {
            position: absolute; inset: 0;
        }
    }
    fieldset:nth-child(2) {
        &>* {margin-top: .5em;}
        output {display: block;}
    }
    label:has(input[multiple]),img {
        border: .1em solid var(--theme);
        width: 100%; 
    }
    img:not([src]) {
        border-color: silver;
        min-height: 10em;
    }
    button {
        background: var(--theme); border-radius: .5em;
        color: black;
    }
    label {display: block;}
    label:has(:checked) {color: var(--theme);}
}
.processing {filter: brightness(.5);}
</style>

<script type="module">
const FORM = document.forms[0], MAIN = {
    ctx: Q('canvas').getContext('2d', { alpha: true }),
    setSide: S => MAIN.hS = (FORM.side.value = MAIN.S = MAIN.ctx.canvas.width = MAIN.ctx.canvas.height = Math.floor(S))/2
};
Q('#CX').onchange = ev => {
    const reader = new FileReader;
    reader.readAsDataURL(ev.target.files[0]);
    reader.onload = () => E.img(reader.result).then(img => {
        MAIN.setSide(Math.max(img.naturalWidth, img.naturalHeight));
        MAIN.img = img;
        Draw();
    });
}
FORM.oninput = () => Draw();
document.addEventListener("keydown", ev => { 
    ev.key.startsWith('Arrow') && ev.preventDefault();
    ev.key == "ArrowUp"    && FORM.y.value++;
    ev.key == "ArrowDown"  && FORM.y.value--;
    ev.key == "ArrowLeft"  && FORM.x.value--;
    ev.key == "ArrowRight" && FORM.x.value++;
});
const Draw = (editing = true) => {
    editing ? Draw.bg() : MAIN.ctx.clearRect(0, 0, 999, 999);
    if (MAIN.img) {
        let {x, y, W, H} = Draw.transform(MAIN.ctx, Object.fromEntries([...new FormData(FORM)]), MAIN.img);
        MAIN.ctx.drawImage(MAIN.img, x, y, W, H);
    }
    editing && Draw.bisectors();
}
Object.assign(Draw, {
    bg () {
        MAIN.ctx.fillStyle = Q('input[type=color]').value;
        MAIN.ctx.fillRect(0, 0, 999, 999);
    },
    bisectors () {
        const { ctx, S, hS } = MAIN, r1 = S / 2.6, r2 = S / 5;
        MAIN.ctx.strokeStyle = 'lime';
        MAIN.ctx.lineWidth = 1;
        ctx.stroke(new Path2D(`M0,${hS} H${S} M${hS},0 V${S}
        M${hS - r1},${hS} A${r1},${r1} 0 1 0 ${hS + r1},${hS}A${r1},${r1} 0 1 0 ${hS - r1},${hS}
        M${hS - r2},${hS} A${r2},${r2} 0 1 0 ${hS + r2},${hS}A${r2},${r2} 0 1 0 ${hS - r2},${hS}`));
    },
    transform (con, {sk, sc, ro, st, x, y}, img) { //translate -> skew -> scale -> rotate -> stretch
        sk ??= 0, sc ??= 1, ro ??= 0, st ??= 1, x ??= 0, y ??= 0;
        MAIN.setSide(Math.max(img.naturalWidth, img.naturalHeight)/sc);
        sc = 1;

        let drawing = {W: img.naturalWidth, H: img.naturalHeight};
        drawing.hW = drawing.W/2, drawing.hH = drawing.H/2;

        let cos = Math.cos(ro*Math.PI), sin = Math.sin(ro*Math.PI), tan = Math.tan(sk*Math.PI);
        x = -x-MAIN.hS, y = y-MAIN.hS;
        con.setTransform(sc*cos, sc*st*sin, sc*(cos*tan-sin), sc*st*(sin*tan+cos), x*sc*cos+y*sc*(cos*tan-sin)-x, x*sc*st*sin+y*sc*st*(sin*tan+cos)-y);
        return {x: Math.round(-x-drawing.hW), y: Math.round(-y-drawing.hH), W: drawing.W, H: drawing.H};
    },
});

let IMGS = [];
Q('input[multiple]').onchange = ev => {
    IMGS = IMGS.concat(...ev.target.files);
    if (IMGS.length === 0) return;
    Q('img', img => img.remove());
    IMGS.forEach(display);
};
let session;
RembgWeb.rembgConfig.setBaseUrl('https://huggingface.co/bunnio/dis_anime/resolve/main');
RembgWeb.newSession('isnet-general-use').then(s => session = s);
import {Call} from './package/magickApi.js'
import LibImageQuant from './package/libimagequant.mjs'
Q('button').onclick = async ev => {
    ev.preventDefault();
    Draw(false);
    const images = [...MAIN.img ? [Q('canvas')] : [], ...IMGS];
    for (let image of images) {
        const canvas = image instanceof HTMLCanvasElement;
        const name = image.name || '0.png';
        const img = Q(canvas ? 'canvas' : `img[alt='${name}']`);
        img.classList.add('processing');

        try {
            image = canvas ? await new Promise(res => image.toBlob(res, 'image/png')) : image;
            FORM.Rembg.checked && (image = await RembgWeb.remove(image, {session}));
            image = await image.arrayBuffer();
            FORM.Magick.checked && ([{buffer: image}] = await Call(
                [{name, content: new Uint8Array(image)}], 
                ['convert', name,
                    ...canvas ? [] : ['-resize', `${FORM.size.value}>`, '-fuzz', '5%', '-trim'],
                    canvas ? '1.png' : name.replace(/\.[^/.]+$/, "")
                ]
            ));
            image = new Blob([image], {type: 'image/png'});
            FORM.Quant.checked && ({pngBytes: image} = await new LibImageQuant().quantizePng(
                image, {quality: {min: 65, target: 65}}
            ));
            display(canvas ? '' : name, image);
        } catch (er) {
            console.error(er);
            document.body.append(`${er}`);
        }
        img.classList.remove('processing');
    }
}
const display = (file, data) => {
    let src = URL.createObjectURL(typeof file == 'object' ? file : new Blob([data], {type: 'image/png'}));
    let img = E('img', {
        src, alt: file?.name || 'chip',
        onload: () => !data && URL.revokeObjectURL(src)
    });
    typeof file == 'object' || !file ? 
        Q('label:has(input[multiple])').after(img) : Q(`img[alt='${file}']`).replaceWith(img);
}
</script>
